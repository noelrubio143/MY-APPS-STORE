<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin</title>
<style>
:root{--bg:#fff;--card:#f4f6f8;--text:#1f1f1f;--muted:#5f6368;--accent:#01875f}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1e1f22;--text:#e8eaed;--muted:#9aa0a6;--accent:#34c38f}}
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);max-width:520px;margin:auto}
input,textarea{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid var(--muted);background:var(--card);color:var(--text);font-size:1rem;font-family:inherit}
label{font-size:.85rem;color:var(--muted)}
button{width:100%;background:var(--accent);color:#fff;border:0;border-radius:24px;padding:13px;font-weight:600;font-size:1rem}
button:disabled{opacity:.5}
.rel{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:10px 12px;margin-top:10px}
.rel div{min-width:0;overflow-wrap:anywhere}
.rel button{width:auto;flex:none;background:#d93025;padding:9px 16px;font-size:.9rem}
#rl{margin-top:6px}
#log{white-space:pre-wrap;font-size:.9rem;margin-top:14px;line-height:1.5}
progress{width:100%;height:14px;margin-top:10px;display:none}
small{color:var(--muted)}
</style>
</head>
<body>
<h2>Admin: Magdagdag ng App</h2>
<label>GitHub token <small>(Contents at Actions: Read &amp; write)</small></label>
<input id="tk" type="password" placeholder="github_pat_..." autocomplete="off">
<small>Nakatago lang ito sa browser mo hanggang isara ang tab. Hindi ito nase-save sa site.</small>
<hr>
<label>Tag</label><input id="tg" placeholder="hal. v1.0">
<label>Title</label><input id="tt" placeholder="hal. Pangalan ng App 1.0">
<label>Paglalarawan <small>(notes ng Release)</small></label><textarea id="ds" rows="4"></textarea>
<label>APK file</label><input id="af" type="file" accept=".apk,application/vnd.android.package-archive">
<button id="go" onclick="run()">I-upload sa Release at idagdag</button>
<progress id="pg" max="100" value="0"></progress>
<div id="log"></div>
<hr>
<h2>Mga App sa website</h2>
<small>Parehong listahan ng website. Ang pagbura ay mag-aalis din ng Release at APK.</small>
<div id="rl"></div>
<script>
const REPO="noelrubio143/MY-APPS-STORE",$=i=>document.getElementById(i);
$("tk").value=sessionStorage.getItem("tk")||"";
const log=t=>$("log").textContent+=t+"\n";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
const fileB64=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.readAsDataURL(f)});
async function gh(url,opt={}){
 const r=await fetch(url,{...opt,headers:{Authorization:"Bearer "+$("tk").value.trim(),Accept:"application/vnd.github+json",...(opt.headers||{})}});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error((j.message||r.status)+" ("+url.split("/").slice(3,7).join("/")+")");
 return j;
}
async function putChunk(api,branch,n,blob){
 const path=`chunks/part-${String(n).padStart(4,"0")}`;
 for(let t=1;t<=3;t++){
  try{
   return await gh(`${api}/contents/${path}`,{method:"PUT",body:JSON.stringify({message:"part "+n,content:await fileB64(blob),branch})});
  }catch(e){if(t==3)throw e;await sleep(1500*t)}
 }
}
const API=`https://api.github.com/repos/${REPO}`;
async function loadRel(){
 const box=$("rl");box.textContent="Kinukuha...";
 try{
  const r=await fetch("apps.json?"+Date.now());
  const list=await r.json();
  box.textContent="";
  if(!list.length){box.textContent="Walang app sa listahan.";return}
  list.forEach(a=>{
   const row=document.createElement("div");row.className="rel";
   const t=document.createElement("div");
   const b=document.createElement("b");b.textContent=a.name;
   const sm=document.createElement("small");sm.textContent="v"+a.version+" • "+a.size;
   t.append(b,document.createElement("br"),sm);
   const d=document.createElement("button");d.textContent="Burahin";
   d.onclick=()=>delApp(a,d);
   row.append(t,d);box.append(row);
  });
 }catch(e){box.textContent="May mali: "+e.message}
}
async function delApp(a,btn){
 const tk=$("tk").value.trim();
 if(!tk){alert("Ilagay muna ang GitHub token.");return}
 sessionStorage.setItem("tk",tk);
 if(!confirm('Burahin ang "'+a.name+' '+a.version+'"?\nMaaalis ito sa website at mabubura ang Release at APK nito.'))return;
 btn.disabled=true;btn.textContent="...";
 try{
  const m=String(a.apk||"").match(/\/releases\/download\/([^/]+)\//);
  if(m){
   const tag=decodeURIComponent(m[1]);
   try{
    const rel=await gh(`${API}/releases/tags/${encodeURIComponent(tag)}`);
    await gh(`${API}/releases/${rel.id}`,{method:"DELETE"});
   }catch(e){if(!/Not Found/i.test(e.message))throw e}
   try{await gh(`${API}/git/refs/tags/${encodeURIComponent(tag)}`,{method:"DELETE"})}catch(e){}
  }
  const cur=await gh(`${API}/contents/apps.json`);
  const list=JSON.parse(unb64(cur.content));
  const keep=list.filter(x=>!(x.name===a.name&&x.apk===a.apk));
  await gh(`${API}/contents/apps.json`,{method:"PUT",body:JSON.stringify({message:"remove "+a.name,content:b64(JSON.stringify(keep,null,1)),sha:cur.sha})});
  await loadRel();
 }catch(e){alert("May mali: "+e.message);btn.disabled=false;btn.textContent="Burahin"}
}
loadRel();
async function run(){
 const tk=$("tk").value.trim();
 const af=$("af").files[0];
 let apk="",sizeMB="";
 const tag=$("tg").value.trim(),title=$("tt").value.trim();
 if(!tk||!tag||!title||!af){alert("Kailangan: token, tag, title, at APK file.");return}
 const name=title,ver=tag;
 sessionStorage.setItem("tk",tk);
 $("go").disabled=true;$("log").textContent="";
 const pg=$("pg");
 try{
  const fname=tag.replace(/[^A-Za-z0-9._-]+/g,"-")+".apk";
  const api=`https://api.github.com/repos/${REPO}`;
  if(af){
   sizeMB=(af.size/1048576).toFixed(1);
   const base=(await gh(api)).default_branch;
   let oldId=0;
   try{const r=await gh(`${api}/releases/tags/${encodeURIComponent(tag)}`);const o=(r.assets||[]).find(a=>a.name===fname);if(o)oldId=o.id}catch(e){}
   log("1/4 Inihahanda ang pag-upload ("+sizeMB+" MB)...");
   const sha=(await gh(`${api}/git/ref/heads/${base}`)).object.sha;
   const branch="upload-"+tag.replace(/[^A-Za-z0-9._-]+/g,"-")+"-"+Date.now();
   await gh(`${api}/git/refs`,{method:"POST",body:JSON.stringify({ref:"refs/heads/"+branch,sha})});
   const CH=6*1048576,total=Math.ceil(af.size/CH);
   pg.style.display="block";pg.value=0;
   for(let i=0;i<total;i++){
    log("2/4 Piraso "+(i+1)+" sa "+total+"...");
    await putChunk(api,branch,i+1,af.slice(i*CH,(i+1)*CH));
    pg.value=Math.round((i+1)/total*100);
   }
   pg.style.display="none";
   log("3/4 Ipinapasok sa Release (GitHub Actions)...");
   await gh(`${api}/actions/workflows/release-upload.yml/dispatches`,{method:"POST",body:JSON.stringify({ref:base,inputs:{tag,title,notes:$("ds").value.trim(),branch,filename:fname}})});
   let a=null;
   for(let i=0;i<120&&!a;i++){
    await sleep(5000);
    try{const r=await gh(`${api}/releases/tags/${encodeURIComponent(tag)}`);const f=(r.assets||[]).find(x=>x.name===fname&&x.id!==oldId);if(f)a=f}catch(e){}
   }
   if(!a)throw new Error("Hindi pa lumalabas ang APK sa Release. Tingnan ang Actions tab ng repo para sa error, tapos pindutin ulit ang button.");
   apk=a.browser_download_url;
   log("   Nasa Release na: "+a.name);
  }
  log("4/4 Dinadagdag sa listahan...");
  const cur=await gh(`${api}/contents/apps.json`);
  const list=JSON.parse(unb64(cur.content));
  const entry={name,version:ver,size:(sizeMB||"?")+" MB",desc:$("ds").value.trim(),apk};
  const i=list.findIndex(a=>a.name.toLowerCase()==name.toLowerCase());
  if(i>=0)list[i]=entry;else list.push(entry);
  await gh(`${api}/contents/apps.json`,{method:"PUT",body:JSON.stringify({message:"add "+name,content:b64(JSON.stringify(list,null,1)),sha:cur.sha})});
  log("\nTapos na! Lalabas ang app sa site pagkatapos ng 1-2 minuto.");setTimeout(loadRel,90000);
 }catch(e){log("\nMay mali: "+e.message)}
 $("go").disabled=false;$("pg").style.display="none";
}
</script>
</body>
</html>
