<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin</title>
<style>
:root{--bg:#fff;--card:#f4f6f8;--text:#1f1f1f;--muted:#5f6368;--accent:#01875f}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1e1f22;--text:#e8eaed;--muted:#9aa0a6;--accent:#34c38f}}
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);max-width:520px;margin:auto}
input,textarea{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid var(--muted);background:var(--card);color:var(--text);font-size:1rem;font-family:inherit}
label{font-size:.85rem;color:var(--muted)}
button{width:100%;background:var(--accent);color:#fff;border:0;border-radius:24px;padding:13px;font-weight:600;font-size:1rem}
button:disabled{opacity:.5}
#log{white-space:pre-wrap;font-size:.9rem;margin-top:14px;line-height:1.5}
small{color:var(--muted)}
progress{width:100%;height:14px;margin-top:10px;display:none}
</style>
</head>
<body>
<h2>Admin: Magdagdag ng App</h2>
<label>GitHub token <small>(kailangan ang Contents: Read &amp; write)</small></label>
<input id="tk" type="password" placeholder="github_pat_..." autocomplete="off">
<small>Nakatago lang ito sa browser mo hanggang isara ang tab. Hindi ito nase-save sa site.</small>
<hr>
<label>APK file (ia-upload direkta sa Release)</label><input id="af" type="file" accept=".apk,application/vnd.android.package-archive">
<label>O kaya, link ng APK (kung naka-upload na; hindi na kailangan kung may file sa taas)</label><input id="al" type="url" placeholder="https://github.com/.../releases/download/...">
<label>Laki (MB) <small>- awtomatiko kapag may file</small></label><input id="sz" placeholder="hal. 68.6">
<label>Icon (PNG, optional)</label><input id="ic" type="file" accept="image/*">
<label>Pangalan ng app</label><input id="nm">
<label>Category</label><input id="ct" placeholder="hal. Tools, Games, VPN">
<label>Bersyon</label><input id="vr" placeholder="hal. 1.0">
<label>Android</label><input id="an" value="8.0+">
<label>Paglalarawan</label><textarea id="ds" rows="4"></textarea>
<button id="go" onclick="run()">I-upload at idagdag</button>
<progress id="pg" max="100" value="0"></progress>
<div id="log"></div>
<script>
const REPO="noelrubio143/MY-APPS-STORE",$=i=>document.getElementById(i);
$("tk").value=sessionStorage.getItem("tk")||"";
const log=t=>$("log").textContent+=t+"\n";
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
const fileB64=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.readAsDataURL(f)});
async function gh(url,opt={}){
 const r=await fetch(url,{...opt,headers:{Authorization:"Bearer "+$("tk").value.trim(),Accept:"application/vnd.github+json",...(opt.headers||{})}});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error((j.message||r.status)+" ("+url.split("/").slice(3,7).join("/")+")");
 return j;
}
function uploadAsset(url,file,onp){
 return new Promise((res,rej)=>{
  const x=new XMLHttpRequest();
  x.open("POST",url);
  x.setRequestHeader("Authorization","Bearer "+$("tk").value.trim());
  x.setRequestHeader("Accept","application/vnd.github+json");
  x.setRequestHeader("Content-Type","application/vnd.android.package-archive");
  x.upload.onprogress=e=>{if(e.lengthComputable)onp(Math.round(e.loaded/e.total*100))};
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}
   x.status>=200&&x.status<300?res(j):rej(new Error((j.message||x.status)+" (upload APK)"))};
  const t0=Date.now();let last=0;
  x.upload.addEventListener("progress",e=>{if(e.lengthComputable)last=Math.round(e.loaded/e.total*100)});
  x.onerror=()=>rej(new Error("Nabigo ang upload (network) sa "+last+"% matapos ang "+Math.round((Date.now()-t0)/1000)+"s"));
  x.ontimeout=()=>rej(new Error("Nag-timeout ang upload sa "+last+"%"));
  x.send(file);
 });
}
async function run(){
 const tk=$("tk").value.trim(),name=$("nm").value.trim(),ver=$("vr").value.trim();
 let al=$("al").value.trim();
 const af=$("af").files[0];
 if(!tk||(!al&&!af)||!name||!ver){alert("Kailangan: token, APK file (o link), pangalan, at bersyon.");return}
 sessionStorage.setItem("tk",tk);
 $("go").disabled=true;$("log").textContent="";
 try{
  const slug=name.toLowerCase().replace(/[^a-z0-9]+/g,"");
  const tag=slug+"-"+ver;
  let apk=al,sizeMB=$("sz").value.trim();
  if(af){
   sizeMB=(af.size/1048576).toFixed(1);
   const api=`https://api.github.com/repos/${REPO}`;
   log("1/4 Gumagawa ng Release "+tag+"...");
   let rel;
   try{
    rel=await gh(`${api}/releases`,{method:"POST",body:JSON.stringify({tag_name:tag,name:name+" "+ver,body:$("ds").value.trim(),draft:false,prerelease:false})});
   }catch(e){
    rel=await gh(`${api}/releases/tags/${encodeURIComponent(tag)}`);
    log("   (Meron nang Release na ito, gagamitin na lang)");
   }
   const fname=slug+"-"+ver+".apk";
   const old=(rel.assets||[]).find(a=>a.name===fname);
   if(old)await gh(`${api}/releases/assets/${old.id}`,{method:"DELETE"});
   log("2/4 Ina-upload ang APK ("+sizeMB+" MB)...");
   const pg=$("pg");pg.style.display="block";pg.value=0;
   const upUrl=rel.upload_url.replace(/\{.*$/,"")+"?name="+encodeURIComponent(fname);
   let up,lastErr;
   for(let t=1;t<=3&&!up;t++){
    try{
     if(t>1){
      log("   Subukan ulit ("+t+"/3)...");
      const cur2=await gh(`${api}/releases/${rel.id}`);
      const part=(cur2.assets||[]).find(a=>a.name===fname);
      if(part)await gh(`${api}/releases/assets/${part.id}`,{method:"DELETE"});
     }
     pg.value=0;
     up=await uploadAsset(upUrl,af,v=>pg.value=v);
    }catch(e){lastErr=e;log("   "+e.message)}
   }
   if(!up)throw new Error("Hindi na-upload ang APK. Ginawa na ang Release '"+tag+"' sa GitHub; puwede mong i-upload ang APK doon mano-mano, tapos i-paste ang link sa field ng link at pindutin ulit ang button.");
   pg.style.display="none";
   apk=up.browser_download_url;
  }
  let icon="";
  const ic=$("ic").files[0];
  if(ic){
   log("3/4 Ina-upload ang icon...");
   icon="icons/"+slug+".png";
   let sha;try{sha=(await gh(`https://api.github.com/repos/${REPO}/contents/${icon}`)).sha}catch(e){}
   await gh(`https://api.github.com/repos/${REPO}/contents/${icon}`,{method:"PUT",body:JSON.stringify({message:"icon "+name,content:await fileB64(ic),sha})});
  }
  log("4/4 Dinadagdag sa listahan...");
  const cur=await gh(`https://api.github.com/repos/${REPO}/contents/apps.json`);
  const list=JSON.parse(unb64(cur.content));
  const entry={name,cat:$("ct").value.trim()||"Iba pa",icon,version:ver,size:(sizeMB||"?")+" MB",android:$("an").value.trim(),desc:$("ds").value.trim(),shots:[],apk};
  const i=list.findIndex(a=>a.name.toLowerCase()==name.toLowerCase());
  if(i>=0)list[i]=entry;else list.push(entry);
  await gh(`https://api.github.com/repos/${REPO}/contents/apps.json`,{method:"PUT",body:JSON.stringify({message:"add "+name,content:b64(JSON.stringify(list,null,1)),sha:cur.sha})});
  log("\nTapos na! Lalabas ang app sa site pagkatapos ng 1-2 minuto.");
 }catch(e){log("\nMay mali: "+e.message)}
 $("go").disabled=false;$("pg").style.display="none";
}
</script>
</body>
</html>
