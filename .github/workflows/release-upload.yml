name: release-upload
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
      title:
        required: true
      notes:
        required: false
        default: ""
      branch:
        required: true
      filename:
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      TITLE: ${{ inputs.title }}
      NOTES: ${{ inputs.notes }}
      BRANCH: ${{ inputs.branch }}
      FILE: ${{ inputs.filename }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Buuin ang APK mula sa mga piraso
        run: |
          cat chunks/part-* > "$FILE"
          ls -l "$FILE"
      - name: I-upload sa Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "$TITLE" --notes "$NOTES"
          fi
      - name: Burahin ang pansamantalang branch
        if: always()
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH"
